<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI data-entry assistant logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FA855"/>
      <stop offset="0.55" stop-color="#0E9E7E"/>
      <stop offset="1" stop-color="#0B7C8C"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF6F1"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#043b34" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- rounded-square app-icon background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="#ffffff" opacity="0.05"/>

  <!-- chat card + tail -->
  <g filter="url(#soft)">
    <path d="M150 326 L150 386 L206 326 Z" fill="url(#doc)"/>
    <rect x="92" y="120" width="328" height="212" rx="40" fill="url(#doc)"/>
  </g>

  <!-- LEFT: document / receipt lines -->
  <g stroke="#0E9E7E" stroke-linecap="round">
    <line x1="132" y1="176" x2="200" y2="176" stroke-width="14"/>
    <line x1="132" y1="212" x2="224" y2="212" stroke-width="12" opacity="0.75"/>
    <line x1="132" y1="244" x2="212" y2="244" stroke-width="12" opacity="0.55"/>
    <line x1="132" y1="276" x2="228" y2="276" stroke-width="12" opacity="0.40"/>
  </g>

  <!-- arrow: document -> structured grid -->
  <path d="M244 234 h30 v-15 l28 23 -28 23 v-15 h-30 z" fill="#F5B301"/>

  <!-- RIGHT: spreadsheet grid -->
  <g>
    <rect x="318" y="170" width="92" height="112" rx="12" fill="#1FA855"/>
    <rect x="318" y="170" width="92" height="30" rx="12" fill="#0B7C8C" opacity="0.95"/>
    <g stroke="#EAF6F1" stroke-width="5" opacity="0.92">
      <line x1="318" y1="200" x2="410" y2="200"/>
      <line x1="318" y1="228" x2="410" y2="228"/>
      <line x1="318" y1="255" x2="410" y2="255"/>
      <line x1="349" y1="170" x2="349" y2="282"/>
      <line x1="379" y1="170" x2="379" y2="282"/>
    </g>
  </g>

  <!-- AI sparkle -->
  <g fill="#F5B301">
    <path d="M388 128 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9 z"/>
    <circle cx="352" cy="150" r="6"/>
  </g>
</svg>
